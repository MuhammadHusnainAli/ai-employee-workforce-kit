[project]
name = "service-template"
version = "0.1.0"
description = "Python service template. `just new-service python <name>` copies and renames it."
requires-python = ">=3.13"
license = "Apache-2.0"
dependencies = [
    "wfk-platform",
    "wfk-contracts",
    "uvicorn>=0.32",
    "grpcio>=1.71",
    "grpcio-health-checking>=1.71",
]

[project.scripts]
service-template = "service_template.main:run"

[dependency-groups]
dev = ["httpx>=0.28"]

[tool.uv.sources]
wfk-platform = { workspace = true }
wfk-contracts = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/service_template"]
