[project]
name = "wfk-platform"
version = "0.1.0"
description = "Infrastructure for Python services: settings, telemetry, health, tenancy, outbox and inbox. No domain logic."
requires-python = ">=3.13"
license = "Apache-2.0"
dependencies = [
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "fastapi>=0.115",
    "opentelemetry-api>=1.29",
    "opentelemetry-sdk>=1.29",
    "opentelemetry-exporter-otlp-proto-grpc>=1.29",
]

[dependency-groups]
dev = ["httpx>=0.28"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wfk_platform"]
