[project]
name = "wfk-contracts"
version = "0.1.0"
description = "Python types and gRPC stubs generated from /contracts/proto"
requires-python = ">=3.13"
license = "Apache-2.0"
dependencies = [
    "protobuf>=6.31",
    "grpcio>=1.71",
]

[dependency-groups]
dev = ["grpcio-tools>=1.71"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wfk"]
