[project]
name = "brain-core"
version = "0.1.0"
description = "Recall fusion, ranking and packing (Rust, PyO3)"
requires-python = ">=3.13"
license = "Apache-2.0"

[build-system]
requires = ["maturin>=1.9,<2"]
build-backend = "maturin"

[tool.maturin]
python-source = "python"
module-name = "brain_core._native"
features = ["python"]
