[package]
name = "brain-core"
version = "0.1.0"
description = "Recall ranking and the write-path governance filter for the Brain Service, exposed to Python with PyO3"
edition = "2024"
license = "Apache-2.0"
rust-version = "1.99"
publish = false

[lib]
name = "brain_core"
crate-type = ["cdylib", "rlib"]   # cdylib for Python, rlib for `cargo test`

[dependencies]
regex = "1"
pyo3 = { version = "0.30", features = ["extension-module", "abi3-py313"], optional = true }

[features]
default = []   # plain `cargo test` checks the pure core; maturin enables "python"
python = ["dep:pyo3"]

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = "thin"
codegen-units = 1
