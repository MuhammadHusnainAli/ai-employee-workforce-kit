[package]
name = "channel-gateway"
version = "0.1.0"
description = "Inbound and outbound conversation channels: Slack, Teams, Google Chat, email and webhooks"
edition = "2024"
license = "Apache-2.0"
rust-version = "1.99"
publish = false

[dependencies]
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
futures = "0.3"
uuid = { version = "1", features = ["v4", "v5", "v7", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
envy = "0.4"
# HTTP and gRPC
axum = "0.8"
tonic = "0.14"
tonic-prost = "0.14"
tonic-health = "0.14"
prost = "0.14"
prost-types = "0.14"
# platform (src/platform)
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "postgres", "uuid", "chrono", "json", "macros", "migrate"] }
async-nats = "0.52"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
opentelemetry = "0.33"
opentelemetry_sdk = { version = "0.33", features = ["rt-tokio"] }
opentelemetry-otlp = { version = "0.33", features = ["grpc-tonic", "trace"] }
tracing-opentelemetry = "0.34"
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"
jsonwebtoken = { version = "12", default-features = false, features = ["aws_lc_rs", "use_pem"] }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls"] }

[build-dependencies]
# Generates src/contracts from contracts/proto with a vendored protoc (no system install).
tonic-prost-build = "0.14"
prost-build = "0.14"
protoc-bin-vendored = "3"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = "thin"
codegen-units = 1
