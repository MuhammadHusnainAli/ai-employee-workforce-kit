[project]
name = "core-python"
version = "0.1.0"
description = "The Python backend: workforce, agent runtime, brain and evaluation in one service (ADR-0017)."
requires-python = ">=3.13"
license = "Apache-2.0"
dependencies = [
    # gRPC (one port; health is the standard gRPC health service)
    "grpcio>=1.71",
    "grpcio-health-checking>=1.71",
    "protobuf>=6.31",
    # platform (src/wfk_platform)
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "opentelemetry-api>=1.29",
    "opentelemetry-sdk>=1.29",
    "opentelemetry-exporter-otlp-proto-grpc>=1.29",
    "psycopg[binary,pool]>=3.2",
    "nats-py>=2.9",
    # Durable runs, brain ingest and evaluations all run on Temporal
    "temporalio>=1.36,<2",
    # The step loop, the extractor and the Evaluator (ADR-0016)
    "agent-harness-adk>=0.2,<0.3",
    # agent_runtime: claim-check payloads in S3; brain: the pinned-context cache
    "boto3>=1.35",
    "valkey>=6",
    "httpx>=0.28",
    # evaluation: suites in YAML
    "pyyaml>=6",
    # brain: the Rust hot path for recall (brain-core/), built with maturin
    "brain-core",
]

[project.scripts]
core-python = "core_python.main:run"
wfk-migrate = "wfk_platform.migrate:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "pyright>=1.1.390",
    "grpcio-tools>=1.71",
]

[tool.uv.sources]
brain-core = { path = "brain-core" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# This service's code, its copy of the platform code, and its generated contracts.
packages = ["src/core_python", "src/wfk_platform", "src/wfk"]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tools"]
extend-exclude = ["src/wfk"]  # generated

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "ASYNC", "S", "RUF"]
ignore = ["S101"]  # assert is fine in tests

[tool.ruff.lint.isort]
# Platform code and generated contracts get their own block before this service's code, so
# import order does not depend on the service's name.
section-order = ["future", "standard-library", "third-party", "platform", "first-party", "local-folder"]

[tool.ruff.lint.isort.sections]
platform = ["wfk", "wfk_platform"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S311", "S608"]  # test data, not secrets or crypto

[tool.pyright]
pythonVersion = "3.13"
typeCheckingMode = "standard"
exclude = [".venv", "src/wfk", "brain-core/target"]
extraPaths = ["tools"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tools"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
markers = ["integration: needs the local docker compose stack (just up at the repo root)"]
