syntax = "proto3";

package wfk.workforce_service.v1;

import "google/protobuf/timestamp.proto";
import "wfk/common/v1/common.proto";

// AI employees and their immutable versions. Owned by workforce-service; callers (agent-runtime,
// the web app) copy this file to build a client.
service WorkforceService {
  // Create an employee. Repeating the same create is a no-op; a different name for the same id
  // is ALREADY_EXISTS.
  rpc CreateEmployee(CreateEmployeeRequest) returns (CreateEmployeeResponse);
  rpc GetEmployee(GetEmployeeRequest) returns (GetEmployeeResponse);
  rpc ListEmployees(ListEmployeesRequest) returns (ListEmployeesResponse);
  // Store a new immutable version and make it active. Idempotent on idempotency_key.
  rpc PublishVersion(PublishVersionRequest) returns (PublishVersionResponse);
  // Make an earlier version active again (rollback). Versions themselves never change.
  rpc SetActiveVersion(SetActiveVersionRequest) returns (SetActiveVersionResponse);
  // One version: the active one when version is 0. Runs pin the version they start with.
  rpc GetVersion(GetVersionRequest) returns (GetVersionResponse);
  rpc PauseEmployee(PauseEmployeeRequest) returns (PauseEmployeeResponse);
  rpc ResumeEmployee(ResumeEmployeeRequest) returns (ResumeEmployeeResponse);

  // The org chart. The person who owns the workspace is the CEO and is not an employee; one
  // employee may be the co-CEO, who reports to the person.
  // Repeating the same create is a no-op; another name for the same id is ALREADY_EXISTS.
  rpc CreateDepartment(CreateDepartmentRequest) returns (CreateDepartmentResponse);
  rpc ListDepartments(ListDepartmentsRequest) returns (ListDepartmentsResponse);
  // Set title, department and manager. INVALID_ARGUMENT when the line would loop, the manager
  // is missing or paused, or a second co-CEO is named.
  rpc PlaceEmployee(PlaceEmployeeRequest) returns (PlaceEmployeeResponse);
  // Every employee with its place, and every department.
  rpc GetOrgChart(GetOrgChartRequest) returns (GetOrgChartResponse);
  // May one employee hand work to another? The co-CEO to any active employee but itself;
  // anyone else to the active employees below them.
  rpc CanDelegate(CanDelegateRequest) returns (CanDelegateResponse);

  // Hiring. A hire costs money, so only a person (actor kind HUMAN) hires or decides a request;
  // anyone else gets PERMISSION_DENIED. A new hire starts with the default org tools.
  // Create, publish version 1 and place, in one transaction. Idempotent on idempotency_key.
  rpc HireEmployee(HireEmployeeRequest) returns (HireEmployeeResponse);
  // An employee asks for a hire. Nothing is created until a person approves it.
  rpc RequestHire(RequestHireRequest) returns (RequestHireResponse);
  rpc ListHireRequests(ListHireRequestsRequest) returns (ListHireRequestsResponse);
  // Approve (hires, exactly as HireEmployee) or reject. FAILED_PRECONDITION once decided.
  rpc DecideHireRequest(DecideHireRequestRequest) returns (DecideHireRequestResponse);
}

enum EmployeeStatus {
  EMPLOYEE_STATUS_UNSPECIFIED = 0;
  EMPLOYEE_STATUS_ACTIVE = 1;
  EMPLOYEE_STATUS_PAUSED = 2;
}

// Risk tier of a tool (architecture/agent-harness.md, stage 4).
enum RiskTier {
  RISK_TIER_UNSPECIFIED = 0;
  RISK_TIER_R0 = 1; // read internal
  RISK_TIER_R1 = 2; // write internal
  RISK_TIER_R2 = 3; // external communication
  RISK_TIER_R3 = 4; // irreversible or financial: always needs a human
}

message ToolGrant {
  string tool = 1;
  RiskTier tier = 2;
}

message Limits {
  int32 max_steps = 1;
  // US dollars per run, as a decimal string.
  string max_cost_usd = 2;
}

message Employee {
  string employee_id = 1;
  string name = 2;
  EmployeeStatus status = 3;
  // 0 until a version is published.
  int32 active_version = 4;
  google.protobuf.Timestamp created_at = 5;
  string title = 6;
  // Empty when the employee is in no department.
  string department_id = 7;
  // Empty: reports to the person.
  string manager_id = 8;
  bool is_co_ceo = 9;
}

message Department {
  string department_id = 1;
  string name = 2;
  // Empty until a head is named.
  string head_employee_id = 3;
  google.protobuf.Timestamp created_at = 4;
}

message EmployeeVersion {
  string employee_id = 1;
  int32 version = 2;
  string role = 3;
  string instructions = 4;
  string model = 5;
  repeated ToolGrant tool_grants = 6;
  // R2 tools this employee may use without asking (targets on the allowlist). R3 always asks.
  repeated string auto_approve = 7;
  Limits limits = 8;
  string created_by = 9;
  google.protobuf.Timestamp created_at = 10;
}

message CreateEmployeeRequest {
  wfk.common.v1.TenantContext tenant = 1;
  string employee_id = 2;
  string name = 3;
}

message CreateEmployeeResponse {
  Employee employee = 1;
}

message GetEmployeeRequest {
  wfk.common.v1.TenantContext tenant = 1;
  string employee_id = 2;
}

message GetEmployeeResponse {
  Employee employee = 1;
}

message ListEmployeesRequest {
  wfk.common.v1.TenantContext tenant = 1;
}

message ListEmployeesResponse {
  repeated Employee employees = 1;
}

message PublishVersionRequest {
  wfk.common.v1.TenantContext tenant = 1;
  string employee_id = 2;
  wfk.common.v1.IdempotencyKey idempotency_key = 3;
  string role = 4;
  string instructions = 5;
  string model = 6;
  repeated ToolGrant tool_grants = 7;
  repeated string auto_approve = 8;
  Limits limits = 9;
}

message PublishVersionResponse {
  EmployeeVersion version = 1;
}

message SetActiveVersionRequest {
  wfk.common.v1.TenantContext tenant = 1;
  string employee_id = 2;
  int32 version = 3;
}

message SetActiveVersionResponse {
  Employee employee = 1;
}

message GetVersionRequest {
  wfk.common.v1.TenantContext tenant = 1;
  string employee_id = 2;
  // 0 means the active version.
  int32 version = 3;
}

message GetVersionResponse {
  EmployeeVersion version = 1;
  EmployeeStatus status = 2;
}

message PauseEmployeeRequest {
  wfk.common.v1.TenantContext tenant = 1;
  string employee_id = 2;
}

message PauseEmployeeResponse {
  Employee employee = 1;
}

message ResumeEmployeeRequest {
  wfk.common.v1.TenantContext tenant = 1;
  string employee_id = 2;
}

message ResumeEmployeeResponse {
  Employee employee = 1;
}

message CreateDepartmentRequest {
  wfk.common.v1.TenantContext tenant = 1;
  string department_id = 2;
  string name = 3;
}

message CreateDepartmentResponse {
  Department department = 1;
}

message ListDepartmentsRequest {
  wfk.common.v1.TenantContext tenant = 1;
}

message ListDepartmentsResponse {
  repeated Department departments = 1;
}

message PlaceEmployeeRequest {
  wfk.common.v1.TenantContext tenant = 1;
  string employee_id = 2;
  string title = 3;
  // Empty: no department.
  string department_id = 4;
  // Empty: reports to the person.
  string manager_id = 5;
  bool is_co_ceo = 6;
  // Make this employee the head of department_id.
  bool department_head = 7;
}

message PlaceEmployeeResponse {
  Employee employee = 1;
}

message GetOrgChartRequest {
  wfk.common.v1.TenantContext tenant = 1;
}

message GetOrgChartResponse {
  repeated Employee employees = 1;
  repeated Department departments = 2;
}

// Who to hire, where they sit, and what their first version says.
message Hire {
  string employee_id = 1;
  string name = 2;
  string title = 3;
  string department_id = 4;
  // Empty: reports to the person.
  string manager_id = 5;
  bool is_co_ceo = 6;
  bool department_head = 7;
  string role = 8;
  string instructions = 9;
  string model = 10;
  // US dollars per run, as a decimal string. Empty: the default.
  string max_cost_usd = 11;
}

enum HireRequestStatus {
  HIRE_REQUEST_STATUS_UNSPECIFIED = 0;
  HIRE_REQUEST_STATUS_PENDING = 1;
  HIRE_REQUEST_STATUS_APPROVED = 2;
  HIRE_REQUEST_STATUS_REJECTED = 3;
}

message HireRequest {
  string request_id = 1;
  Hire hire = 2;
  string reason = 3;
  string requested_by = 4;
  HireRequestStatus status = 5;
  string decided_by = 6;
  string decision_note = 7;
  google.protobuf.Timestamp created_at = 8;
  google.protobuf.Timestamp decided_at = 9;
}

message HireEmployeeRequest {
  wfk.common.v1.TenantContext tenant = 1;
  wfk.common.v1.IdempotencyKey idempotency_key = 2;
  Hire hire = 3;
}

message HireEmployeeResponse {
  Employee employee = 1;
  EmployeeVersion version = 2;
}

message RequestHireRequest {
  wfk.common.v1.TenantContext tenant = 1;
  wfk.common.v1.IdempotencyKey idempotency_key = 2;
  Hire hire = 3;
  // Why the company needs this hire, for the person deciding.
  string reason = 4;
}

message RequestHireResponse {
  HireRequest request = 1;
}

message ListHireRequestsRequest {
  wfk.common.v1.TenantContext tenant = 1;
  // Unspecified: any.
  HireRequestStatus status = 2;
}

message ListHireRequestsResponse {
  repeated HireRequest requests = 1;
}

message DecideHireRequestRequest {
  wfk.common.v1.TenantContext tenant = 1;
  string request_id = 2;
  bool approved = 3;
  string note = 4;
}

message DecideHireRequestResponse {
  HireRequest request = 1;
  // Set when approved.
  Employee employee = 2;
}

message CanDelegateRequest {
  wfk.common.v1.TenantContext tenant = 1;
  string from_employee = 2;
  string to_employee = 3;
}

message CanDelegateResponse {
  bool allowed = 1;
  // Why not, in words the employee can act on. Empty when allowed.
  string reason = 2;
}
