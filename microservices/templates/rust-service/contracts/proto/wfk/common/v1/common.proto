syntax = "proto3";

package wfk.common.v1;

// Types shared by every service contract. Infrastructure only: no domain types live here.

// Who a call is for. Every request that touches tenant data carries one.
// The server sets `app.tenant_id` from it for row-level security.
message TenantContext {
  // Tenant the call acts for. UUID.
  string tenant_id = 1;
  // Cell that serves the tenant.
  string cell_id = 2;
  // The AI employee acting, when the caller is an employee. UUID, empty otherwise.
  string employee_id = 3;
  // The human or service that started the call, for audit.
  Actor actor = 4;
}

// The principal behind a call.
message Actor {
  ActorKind kind = 1;
  // User id, employee id or service name, depending on kind.
  string id = 2;
}

// Kind of principal.
enum ActorKind {
  ACTOR_KIND_UNSPECIFIED = 0;
  ACTOR_KIND_HUMAN = 1;
  ACTOR_KIND_EMPLOYEE = 2;
  ACTOR_KIND_SERVICE = 3;
}

// Required on every mutating call. Repeating a call with the same key returns the first result.
// Agent runs use `run_id:step:call_idx`.
message IdempotencyKey {
  string value = 1;
}

// How a caller should treat a failure. Mirrors the activity error taxonomy.
enum ErrorClass {
  ERROR_CLASS_UNSPECIFIED = 0;
  // Safe to retry with the same idempotency key.
  ERROR_CLASS_RETRYABLE = 1;
  // Retrying will fail the same way.
  ERROR_CLASS_NON_RETRYABLE = 2;
  // The side effect may or may not have happened. Reconcile or ask a human. Never retry blindly.
  ERROR_CLASS_UNKNOWN_OUTCOME = 3;
}

// Attached to a gRPC status as a detail.
message ErrorDetail {
  ErrorClass error_class = 1;
  // Stable machine-readable code, for example "quota_exceeded".
  string code = 2;
  // Human-readable message. Never contains secrets.
  string message = 3;
  // Suggested wait before a retry, in milliseconds. 0 when not applicable.
  int64 retry_after_ms = 4;
}

// Cursor pagination request.
message PageRequest {
  // Maximum items to return. The server may return fewer. 0 means the server default.
  int32 page_size = 1;
  // Opaque cursor from a previous PageResponse. Empty for the first page.
  string page_token = 2;
}

// Cursor pagination response.
message PageResponse {
  // Cursor for the next page. Empty when there are no more items.
  string next_page_token = 1;
}
