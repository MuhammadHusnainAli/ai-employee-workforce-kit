# cargo-deny: licence, advisory and source policy for Rust dependencies (ADR-0007).
# Run: cargo deny check

[graph]
all-features = false

[licenses]
# OSI-approved licences allowed for dependencies. Keep in step with tools/check_licenses.py.
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "0BSD",
    "Zlib",
    "MPL-2.0",
    "Unicode-3.0",
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.9

[licenses.private]
# Workspace crates are Apache-2.0 and never published.
ignore = true

[advisories]
# Known vulnerabilities and unmaintained crates fail the build.
yanked = "deny"

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
