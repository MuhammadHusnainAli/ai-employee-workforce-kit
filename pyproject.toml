# uv workspace root. This file is not a package: each library and Python service
# under libs/python/ and microservices/ is its own member with its own pyproject.toml.

[tool.uv.workspace]
members = ["libs/python/*"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "pyright>=1.1.390",
]

[tool.uv]
default-groups = ["dev"]

[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = ["libs/python/wfk-contracts/src/wfk"]  # generated

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "ASYNC", "S", "RUF"]
ignore = ["S101"]  # assert is fine in tests

[tool.ruff.lint.isort]
known-first-party = ["wfk", "wfk_platform"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S105", "S106", "S608"]

[tool.pyright]
pythonVersion = "3.13"
typeCheckingMode = "standard"
exclude = ["**/.venv", "**/target", "**/node_modules", "templates", "libs/python/wfk-contracts/src/wfk"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
markers = ["integration: needs the local docker compose stack (just up)"]
