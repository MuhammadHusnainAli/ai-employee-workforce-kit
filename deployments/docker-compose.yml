# Local development stack for the AI Employee Workforce Kit.
#
#   just up      start everything and wait until healthy
#   just down    stop (data kept in named volumes)
#   just nuke    stop and delete all data
#
# Every port binds to 127.0.0.1 and can be changed through an environment variable or a
# deployments/.env file (see .env.example). Credentials here are for local use only.
#
# Object storage is SeaweedFS (S3 API), not MinIO: see architecture/adr/0007.

name: wfk

x-restart: &restart
  restart: unless-stopped

# ---- shared settings for the microservices (bottom of this file) ----------------------------
x-service: &service
  restart: unless-stopped
  profiles: ["services"]

x-migrate: &migrate
  profiles: ["services"]
  restart: "no"
  depends_on:
    postgres:
      condition: service_healthy

x-stack: &stack
  postgres:
    condition: service_healthy
  nats:
    condition: service_healthy
  temporal:
    condition: service_healthy
  valkey:
    condition: service_healthy
  seaweedfs:
    condition: service_healthy
  model-gateway:
    condition: service_healthy

# Every setting names a stack container on its internal port.
x-service-env: &service-env
  WFK_ENVIRONMENT: local
  WFK_CELL_ID: cell-local
  WFK_NATS_URL: nats://nats:4222
  WFK_TEMPORAL_ADDRESS: temporal:7233
  WFK_VALKEY_URL: redis://valkey:6379/0
  WFK_S3_ENDPOINT: http://seaweedfs:8333
  WFK_MODEL_GATEWAY_URL: http://model-gateway:4000/v1
  WFK_MODEL_GATEWAY_KEY: ${WFK_LITELLM_MASTER_KEY:-sk-wfk-local}

x-grpc-health: &grpc-health
  interval: 5s
  timeout: 5s
  retries: 30
  start_period: 10s

# Python services serve the standard gRPC health service; "readiness" checks their dependencies.
x-grpc-probe: &grpc-probe >-
  import sys, grpc;
  from grpc_health.v1 import health_pb2 as h, health_pb2_grpc as g;
  stub = g.HealthStub(grpc.insecure_channel("127.0.0.1:" + sys.argv[1]));
  r = stub.Check(h.HealthCheckRequest(service="readiness"), timeout=3);
  sys.exit(0 if r.status == h.HealthCheckResponse.SERVING else 1)

services:
  # PostgreSQL 18 with pgvector: the only system of record. One instance locally;
  # production splits it into pg-app, pg-ledger, pg-brain and pg-temporal clusters.
  postgres:
    <<: *restart
    image: pgvector/pgvector:0.8.7-pg18-trixie
    environment:
      POSTGRES_USER: ${WFK_PG_USER:-wfk}
      POSTGRES_PASSWORD: ${WFK_PG_PASSWORD:-wfk}
      POSTGRES_DB: wfk
    command: ["postgres", "-c", "max_connections=300", "-c", "shared_preload_libraries=pg_stat_statements"]
    ports:
      - "127.0.0.1:${WFK_PG_PORT:-7000}:5432"
    volumes:
      # PostgreSQL 18 images keep data under /var/lib/postgresql/18/docker.
      - pg-data:/var/lib/postgresql
      - ./local/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d wfk"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Temporal: durable execution for every agent run, persisted in PostgreSQL.
  temporal:
    <<: *restart
    image: temporalio/auto-setup:1.29.7
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_USER: ${WFK_PG_USER:-wfk}
      POSTGRES_PWD: ${WFK_PG_PASSWORD:-wfk}
      POSTGRES_SEEDS: postgres
      BIND_ON_IP: 0.0.0.0
      TEMPORAL_BROADCAST_ADDRESS: 127.0.0.1
      DEFAULT_NAMESPACE: default
    ports:
      - "127.0.0.1:${WFK_TEMPORAL_PORT:-7001}:7233"
    healthcheck:
      test: ["CMD-SHELL", "temporal operator cluster health --address 127.0.0.1:7233 | grep -q SERVING"]
      interval: 5s
      timeout: 5s
      retries: 40
      start_period: 20s

  temporal-ui:
    <<: *restart
    image: temporalio/ui:2.58.1
    depends_on:
      temporal:
        condition: service_healthy
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_CORS_ORIGINS: http://localhost:${WFK_TEMPORAL_UI_PORT:-7002}
    ports:
      - "127.0.0.1:${WFK_TEMPORAL_UI_PORT:-7002}:8080"

  # NATS JetStream: the event bus (outbox relay publishes here).
  nats:
    <<: *restart
    image: nats:2.15.3-alpine
    command: ["-js", "-sd", "/data", "-m", "8222", "--name", "wfk-local"]
    ports:
      - "127.0.0.1:${WFK_NATS_PORT:-7003}:4222"
      - "127.0.0.1:${WFK_NATS_MONITOR_PORT:-7004}:8222"
    volumes:
      - nats-data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- 'http://127.0.0.1:8222/healthz?js-enabled-only=true' | grep -q ok"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Valkey: ephemeral cache and rate limits only. Losing it costs latency, never correctness.
  valkey:
    <<: *restart
    image: valkey/valkey:9.1.3-alpine
    command: ["valkey-server", "--save", "", "--appendonly", "no"]
    ports:
      - "127.0.0.1:${WFK_VALKEY_PORT:-7005}:6379"
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  # SeaweedFS: S3-compatible object storage for artifacts, large payloads and backups.
  seaweedfs:
    <<: *restart
    image: chrislusf/seaweedfs:4.54
    command: ["server", "-dir=/data", "-ip.bind=0.0.0.0", "-s3", "-s3.port=8333", "-s3.config=/etc/seaweedfs/s3.json"]
    ports:
      - "127.0.0.1:${WFK_S3_PORT:-7006}:8333"
    volumes:
      - seaweed-data:/data
      - ./local/seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8333/status >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s

  # Creates the local buckets, then exits. Run by `just up` after the stack is healthy
  # (kept in a profile because `up --wait` treats a container that exits as a failure).
  seaweedfs-init:
    image: chrislusf/seaweedfs:4.54
    profiles: ["init"]
    depends_on:
      seaweedfs:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        for b in wfk-artifacts wfk-payloads wfk-backups; do
          echo "s3.bucket.list" | weed shell -master=seaweedfs:9333 | grep -qw "$$b" && continue
          echo "s3.bucket.create -name $$b" | weed shell -master=seaweedfs:9333 || exit 1
        done
        echo "buckets ready"
    restart: "no"

  # Model Gateway: LiteLLM proxy, the only path to any LLM. Model names map to providers in
  # local/litellm/config.yaml; provider keys come from deployments/.env.
  model-gateway:
    <<: *restart
    image: ghcr.io/berriai/litellm:v1.108.10-lts
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    environment:
      LITELLM_MASTER_KEY: ${WFK_LITELLM_MASTER_KEY:-sk-wfk-local}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    ports:
      - "127.0.0.1:${WFK_MODEL_GATEWAY_PORT:-7007}:4000"
    volumes:
      - ./local/litellm/config.yaml:/app/config.yaml:ro
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:4000/health/liveliness')\""]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  # Grafana LGTM: OTel collector, Prometheus, Loki, Tempo and Grafana in one container.
  observability:
    <<: *restart
    image: grafana/otel-lgtm:0.41.0
    ports:
      - "127.0.0.1:${WFK_GRAFANA_PORT:-7008}:3000"
      - "127.0.0.1:${WFK_OTLP_GRPC_PORT:-7009}:4317"
      - "127.0.0.1:${WFK_OTLP_HTTP_PORT:-7010}:4318"
    volumes:
      - lgtm-data:/data

  # ---- microservices ------------------------------------------------------------------------
  # Profile "services": `just up-all` builds and starts them after the stack above; `just up`
  # alone starts only the stack, so a service can run from its folder on the same port.
  # Each service has a one-shot `<name>-migrate` that must succeed before the service starts.
  # Inside the network services reach the stack on its internal ports (postgres:5432 ...).

  workforce-migrate:
    <<: *migrate
    image: wfk/workforce-service:local
    build: ../microservices/workforce-service
    command: ["wfk-migrate", "up", "--dsn", "postgresql://wfk:wfk@postgres:5432/workforce_db", "--dir", "/app/migrations", "--create-db"]

  workforce-service:
    <<: *service
    image: wfk/workforce-service:local
    depends_on:
      <<: *stack
      workforce-migrate:
        condition: service_completed_successfully
    environment:
      <<: *service-env
      WFK_DATABASE_URL: postgresql://wfk:wfk@postgres:5432/workforce_db
    ports:
      - "127.0.0.1:${WFK_WORKFORCE_PORT:-7011}:7011"
    healthcheck:
      <<: *grpc-health
      test: ["CMD", "python", "-c", *grpc-probe, "7011"]

  agent-runtime-migrate:
    <<: *migrate
    image: wfk/agent-runtime:local
    build: ../microservices/agent-runtime
    command: ["wfk-migrate", "up", "--dsn", "postgresql://wfk:wfk@postgres:5432/run_db", "--dir", "/app/migrations", "--create-db"]

  # RunService (read API for run history).
  agent-runtime:
    <<: *service
    image: wfk/agent-runtime:local
    depends_on: &agent-runtime-deps
      <<: *stack
      agent-runtime-migrate:
        condition: service_completed_successfully
    environment: &agent-runtime-env
      <<: *service-env
      WFK_DATABASE_URL: postgresql://wfk:wfk@postgres:5432/run_db
      WFK_BRAIN_ADDRESS: brain-service:7014
    ports:
      - "127.0.0.1:${WFK_AGENT_RUNTIME_PORT:-7012}:7012"
    healthcheck:
      <<: *grpc-health
      test: ["CMD", "python", "-c", *grpc-probe, "7012"]

  # Temporal workers, the run outbox relay (RUNS) and the task inbox (TASKS). No port.
  # The model is local-mock through the gateway; set WFK_WORKER_MODEL=claude-haiku for a real one.
  agent-runtime-worker:
    <<: *service
    image: wfk/agent-runtime:local
    depends_on: *agent-runtime-deps
    environment: *agent-runtime-env
    command: ["agent-runtime", "worker", "--model", "${WFK_WORKER_MODEL:-local-mock}"]

  brain-migrate:
    <<: *migrate
    image: wfk/brain-service:local
    build: ../microservices/brain-service
    command: ["wfk-migrate", "up", "--dsn", "postgresql://wfk:wfk@postgres:5432/brain_db", "--dir", "/app/migrations", "--create-db"]

  brain-service:
    <<: *service
    image: wfk/brain-service:local
    depends_on:
      <<: *stack
      brain-migrate:
        condition: service_completed_successfully
    environment:
      <<: *service-env
      WFK_DATABASE_URL: postgresql://wfk:wfk@postgres:5432/brain_db
    ports:
      - "127.0.0.1:${WFK_BRAIN_PORT:-7014}:7014"
    healthcheck:
      <<: *grpc-health
      test: ["CMD", "python", "-c", *grpc-probe, "7014"]

  # The write path: finished runs (RUNS stream) become memories through BrainIngest on the
  # Temporal queue brain-ingest. No port. WFK_BRAIN_EXTRACTOR=gateway adds facts, preferences
  # and lessons from a real model (WFK_BRAIN_EXTRACTION_MODEL, needs ANTHROPIC_API_KEY).
  brain-ingest:
    <<: *service
    image: wfk/brain-service:local
    depends_on:
      <<: *stack
      brain-migrate:
        condition: service_completed_successfully
    environment:
      <<: *service-env
      WFK_DATABASE_URL: postgresql://wfk:wfk@postgres:5432/brain_db
      WFK_EXTRACTOR: ${WFK_BRAIN_EXTRACTOR:-baseline}
      WFK_EXTRACTION_MODEL: ${WFK_BRAIN_EXTRACTION_MODEL:-claude-haiku}
    command: ["brain-service", "ingest"]

  task-migrate:
    <<: *migrate
    image: wfk/task-service:local
    build: ../microservices/task-service
    command: ["migrate"]
    environment:
      WFK_DATABASE_URL: postgresql://wfk:wfk@postgres:5432/task_db

  task-service:
    <<: *service
    image: wfk/task-service:local
    depends_on:
      <<: *stack
      task-migrate:
        condition: service_completed_successfully
    environment:
      <<: *service-env
      WFK_DATABASE_URL: postgresql://wfk:wfk@postgres:5432/task_db
    ports:
      - "127.0.0.1:${WFK_TASK_PORT:-7016}:7016"
    healthcheck:
      <<: *grpc-health
      test: ["CMD", "/service", "healthcheck"]

volumes:
  pg-data:
  nats-data:
  seaweed-data:
  lgtm-data:
