# Local development stack for the AI Employee Workforce Kit.
#
#   just up      start everything and wait until healthy
#   just down    stop (data kept in named volumes)
#   just nuke    stop and delete all data
#
# Every port binds to 127.0.0.1 and can be changed through an environment variable or a
# deployments/.env file (see .env.example). Credentials here are for local use only.
#
# Object storage is SeaweedFS (S3 API), not MinIO: see architecture/adr/0007.

name: wfk

x-restart: &restart
  restart: unless-stopped

services:
  # PostgreSQL 18 with pgvector: the only system of record. One instance locally;
  # production splits it into pg-app, pg-ledger, pg-brain and pg-temporal clusters.
  postgres:
    <<: *restart
    image: pgvector/pgvector:0.8.7-pg18-trixie
    environment:
      POSTGRES_USER: ${WFK_PG_USER:-wfk}
      POSTGRES_PASSWORD: ${WFK_PG_PASSWORD:-wfk}
      POSTGRES_DB: wfk
    command: ["postgres", "-c", "max_connections=300", "-c", "shared_preload_libraries=pg_stat_statements"]
    ports:
      - "127.0.0.1:${WFK_PG_PORT:-5432}:5432"
    volumes:
      # PostgreSQL 18 images keep data under /var/lib/postgresql/18/docker.
      - pg-data:/var/lib/postgresql
      - ./local/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d wfk"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Temporal: durable execution for every agent run, persisted in PostgreSQL.
  temporal:
    <<: *restart
    image: temporalio/auto-setup:1.29.7
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_USER: ${WFK_PG_USER:-wfk}
      POSTGRES_PWD: ${WFK_PG_PASSWORD:-wfk}
      POSTGRES_SEEDS: postgres
      BIND_ON_IP: 0.0.0.0
      TEMPORAL_BROADCAST_ADDRESS: 127.0.0.1
      DEFAULT_NAMESPACE: default
    ports:
      - "127.0.0.1:${WFK_TEMPORAL_PORT:-7233}:7233"
    healthcheck:
      test: ["CMD-SHELL", "temporal operator cluster health --address 127.0.0.1:7233 | grep -q SERVING"]
      interval: 5s
      timeout: 5s
      retries: 40
      start_period: 20s

  temporal-ui:
    <<: *restart
    image: temporalio/ui:2.58.1
    depends_on:
      temporal:
        condition: service_healthy
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_CORS_ORIGINS: http://localhost:${WFK_TEMPORAL_UI_PORT:-8233}
    ports:
      - "127.0.0.1:${WFK_TEMPORAL_UI_PORT:-8233}:8080"

  # NATS JetStream: the event bus (outbox relay publishes here).
  nats:
    <<: *restart
    image: nats:2.15.3-alpine
    command: ["-js", "-sd", "/data", "-m", "8222", "--name", "wfk-local"]
    ports:
      - "127.0.0.1:${WFK_NATS_PORT:-4222}:4222"
      - "127.0.0.1:${WFK_NATS_MONITOR_PORT:-8222}:8222"
    volumes:
      - nats-data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- 'http://127.0.0.1:8222/healthz?js-enabled-only=true' | grep -q ok"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Valkey: ephemeral cache and rate limits only. Losing it costs latency, never correctness.
  valkey:
    <<: *restart
    image: valkey/valkey:9.1.3-alpine
    command: ["valkey-server", "--save", "", "--appendonly", "no"]
    ports:
      - "127.0.0.1:${WFK_VALKEY_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  # SeaweedFS: S3-compatible object storage for artifacts, large payloads and backups.
  seaweedfs:
    <<: *restart
    image: chrislusf/seaweedfs:4.54
    command: ["server", "-dir=/data", "-ip.bind=0.0.0.0", "-s3", "-s3.port=8333", "-s3.config=/etc/seaweedfs/s3.json"]
    ports:
      - "127.0.0.1:${WFK_S3_PORT:-8333}:8333"
    volumes:
      - seaweed-data:/data
      - ./local/seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8333/status >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s

  # Creates the local buckets, then exits. Run by `just up` after the stack is healthy
  # (kept in a profile because `up --wait` treats a container that exits as a failure).
  seaweedfs-init:
    image: chrislusf/seaweedfs:4.54
    profiles: ["init"]
    depends_on:
      seaweedfs:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        for b in wfk-artifacts wfk-payloads wfk-backups; do
          echo "s3.bucket.list" | weed shell -master=seaweedfs:9333 | grep -qw "$$b" && continue
          echo "s3.bucket.create -name $$b" | weed shell -master=seaweedfs:9333 || exit 1
        done
        echo "buckets ready"
    restart: "no"

  # Model Gateway: LiteLLM proxy, the only path to any LLM. Model names map to providers in
  # local/litellm/config.yaml; provider keys come from deployments/.env.
  model-gateway:
    <<: *restart
    image: ghcr.io/berriai/litellm:v1.108.10-lts
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    environment:
      LITELLM_MASTER_KEY: ${WFK_LITELLM_MASTER_KEY:-sk-wfk-local}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    ports:
      - "127.0.0.1:${WFK_MODEL_GATEWAY_PORT:-4000}:4000"
    volumes:
      - ./local/litellm/config.yaml:/app/config.yaml:ro
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:4000/health/liveliness')\""]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  # Grafana LGTM: OTel collector, Prometheus, Loki, Tempo and Grafana in one container.
  observability:
    <<: *restart
    image: grafana/otel-lgtm:0.41.0
    ports:
      - "127.0.0.1:${WFK_GRAFANA_PORT:-3001}:3000"
      - "127.0.0.1:${WFK_OTLP_GRPC_PORT:-4317}:4317"
      - "127.0.0.1:${WFK_OTLP_HTTP_PORT:-4318}:4318"
    volumes:
      - lgtm-data:/data

volumes:
  pg-data:
  nats-data:
  seaweed-data:
  lgtm-data:
