# Local development stack for the AI Employee Workforce Kit.
#
#   just up      start everything and wait until healthy
#   just down    stop (data kept in named volumes)
#   just nuke    stop and delete all data
#
# Every port binds to 127.0.0.1 and can be changed through an environment variable or a
# deployments/.env file (see .env.example). Credentials here are for local use only.
#
# Object storage is SeaweedFS (S3 API), not MinIO: see architecture/adr/0007.

name: wfk

x-restart: &restart
  restart: unless-stopped

# ---- shared settings for the microservices (bottom of this file) ----------------------------
x-service: &service
  restart: unless-stopped
  profiles: ["services"]

x-migrate: &migrate
  profiles: ["services"]
  restart: "no"
  depends_on:
    postgres:
      condition: service_healthy

x-stack: &stack
  postgres:
    condition: service_healthy
  nats:
    condition: service_healthy
  temporal:
    condition: service_healthy
  valkey:
    condition: service_healthy
  seaweedfs:
    condition: service_healthy
  model-gateway:
    condition: service_healthy

# Every setting names a stack container on its internal port.
x-service-env: &service-env
  WFK_ENVIRONMENT: local
  WFK_CELL_ID: cell-local
  WFK_NATS_URL: nats://nats:4222
  WFK_TEMPORAL_ADDRESS: temporal:7233
  WFK_VALKEY_URL: redis://valkey:6379/0
  WFK_S3_ENDPOINT: http://seaweedfs:8333
  WFK_MODEL_GATEWAY_URL: http://model-gateway:4000/v1
  WFK_MODEL_GATEWAY_KEY: ${WFK_LITELLM_MASTER_KEY:-sk-wfk-local}

x-grpc-health: &grpc-health
  interval: 5s
  timeout: 5s
  retries: 30
  start_period: 10s

# Python services serve the standard gRPC health service; "readiness" checks their dependencies.
x-grpc-probe: &grpc-probe >-
  import sys, grpc;
  from grpc_health.v1 import health_pb2 as h, health_pb2_grpc as g;
  stub = g.HealthStub(grpc.insecure_channel("127.0.0.1:" + sys.argv[1]));
  r = stub.Check(h.HealthCheckRequest(service="readiness"), timeout=3);
  sys.exit(0 if r.status == h.HealthCheckResponse.SERVING else 1)

services:
  # PostgreSQL 18 with pgvector: the only system of record. One instance locally;
  # production splits it into pg-app, pg-ledger, pg-brain and pg-temporal clusters.
  postgres:
    <<: *restart
    image: pgvector/pgvector:0.8.7-pg18-trixie
    environment:
      POSTGRES_USER: ${WFK_PG_USER:-wfk}
      POSTGRES_PASSWORD: ${WFK_PG_PASSWORD:-wfk}
      POSTGRES_DB: wfk
    command: ["postgres", "-c", "max_connections=300", "-c", "shared_preload_libraries=pg_stat_statements"]
    ports:
      - "127.0.0.1:${WFK_PG_PORT:-7017}:5432"
    volumes:
      # PostgreSQL 18 images keep data under /var/lib/postgresql/18/docker.
      - pg-data:/var/lib/postgresql
      - ./local/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d wfk"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Temporal: durable execution for every agent run, persisted in PostgreSQL.
  temporal:
    <<: *restart
    image: temporalio/auto-setup:1.29.7
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_USER: ${WFK_PG_USER:-wfk}
      POSTGRES_PWD: ${WFK_PG_PASSWORD:-wfk}
      POSTGRES_SEEDS: postgres
      BIND_ON_IP: 0.0.0.0
      TEMPORAL_BROADCAST_ADDRESS: 127.0.0.1
      DEFAULT_NAMESPACE: default
    ports:
      - "127.0.0.1:${WFK_TEMPORAL_PORT:-7018}:7233"
    healthcheck:
      test: ["CMD-SHELL", "temporal operator cluster health --address 127.0.0.1:7233 | grep -q SERVING"]
      interval: 5s
      timeout: 5s
      retries: 40
      start_period: 20s

  temporal-ui:
    <<: *restart
    image: temporalio/ui:2.58.1
    depends_on:
      temporal:
        condition: service_healthy
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_CORS_ORIGINS: http://localhost:${WFK_TEMPORAL_UI_PORT:-7019}
    ports:
      - "127.0.0.1:${WFK_TEMPORAL_UI_PORT:-7019}:8080"

  # NATS JetStream: the event bus (outbox relay publishes here).
  nats:
    <<: *restart
    image: nats:2.15.3-alpine
    command: ["-js", "-sd", "/data", "-m", "8222", "--name", "wfk-local"]
    ports:
      - "127.0.0.1:${WFK_NATS_PORT:-7020}:4222"
      - "127.0.0.1:${WFK_NATS_MONITOR_PORT:-7021}:8222"
    volumes:
      - nats-data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- 'http://127.0.0.1:8222/healthz?js-enabled-only=true' | grep -q ok"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Valkey: ephemeral cache and rate limits only. Losing it costs latency, never correctness.
  valkey:
    <<: *restart
    image: valkey/valkey:9.1.3-alpine
    command: ["valkey-server", "--save", "", "--appendonly", "no"]
    ports:
      - "127.0.0.1:${WFK_VALKEY_PORT:-7022}:6379"
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  # SeaweedFS: S3-compatible object storage for artifacts, large payloads and backups.
  seaweedfs:
    <<: *restart
    image: chrislusf/seaweedfs:4.54
    command: ["server", "-dir=/data", "-ip.bind=0.0.0.0", "-s3", "-s3.port=8333", "-s3.config=/etc/seaweedfs/s3.json"]
    ports:
      - "127.0.0.1:${WFK_S3_PORT:-7023}:8333"
    volumes:
      - seaweed-data:/data
      - ./local/seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8333/status >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s

  # Creates the local buckets, then exits. Run by `just up` after the stack is healthy
  # (kept in a profile because `up --wait` treats a container that exits as a failure).
  seaweedfs-init:
    image: chrislusf/seaweedfs:4.54
    profiles: ["init"]
    depends_on:
      seaweedfs:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        for b in wfk-artifacts wfk-payloads wfk-backups; do
          echo "s3.bucket.list" | weed shell -master=seaweedfs:9333 | grep -qw "$$b" && continue
          echo "s3.bucket.create -name $$b" | weed shell -master=seaweedfs:9333 || exit 1
        done
        echo "buckets ready"
    restart: "no"

  # Model Gateway: LiteLLM proxy, the only path to any LLM. Model names map to providers in
  # local/litellm/config.yaml; provider keys come from deployments/.env.
  model-gateway:
    <<: *restart
    image: ghcr.io/berriai/litellm:v1.108.10-lts
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    environment:
      LITELLM_MASTER_KEY: ${WFK_LITELLM_MASTER_KEY:-sk-wfk-local}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    ports:
      - "127.0.0.1:${WFK_MODEL_GATEWAY_PORT:-7024}:4000"
    volumes:
      - ./local/litellm/config.yaml:/app/config.yaml:ro
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:4000/health/liveliness')\""]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  # Grafana LGTM: OTel collector, Prometheus, Loki, Tempo and Grafana in one container.
  observability:
    <<: *restart
    image: grafana/otel-lgtm:0.41.0
    ports:
      - "127.0.0.1:${WFK_GRAFANA_PORT:-7025}:3000"
      - "127.0.0.1:${WFK_OTLP_GRPC_PORT:-7026}:4317"
      - "127.0.0.1:${WFK_OTLP_HTTP_PORT:-7027}:4318"
    volumes:
      - lgtm-data:/data

  # ---- microservices ------------------------------------------------------------------------
  # Two backend services (ADR-0017) and the web app. Profile "services": `just up-all` builds and
  # starts them after the stack above; `just up` alone starts only the stack, so a service can run
  # from its folder on the same port. Each service has a one-shot `<name>-migrate` that applies
  # every module's migrations to that module's own database before the service starts.
  # Inside the network services reach the stack on its internal ports (postgres:5432 ...).

  core-python-migrate:
    <<: *migrate
    image: wfk/core-python:local
    build: ../microservices/core-python
    command: ["core-python", "migrate"]
    environment: &core-python-db
      WFK_WORKFORCE_DATABASE_URL: postgresql://wfk:wfk@postgres:5432/workforce_db
      WFK_RUNTIME_DATABASE_URL: postgresql://wfk:wfk@postgres:5432/run_db
      WFK_BRAIN_DATABASE_URL: postgresql://wfk:wfk@postgres:5432/brain_db
      WFK_EVAL_DATABASE_URL: postgresql://wfk:wfk@postgres:5432/eval_db

  # The Python backend in one process: WorkforceService, RunService and BrainService on 7001,
  # the agent's Temporal workers (live, and evaluation queues apart), brain ingest and nightly
  # consolidation, evaluations, and every outbox relay and inbox.
  # The model is local-mock through the gateway; set WFK_WORKER_MODEL=claude-haiku for a real
  # one. WFK_BRAIN_EXTRACTOR=gateway adds facts, preferences and lessons from a real model
  # (WFK_BRAIN_EXTRACTION_MODEL, needs ANTHROPIC_API_KEY).
  core-python:
    <<: *service
    image: wfk/core-python:local
    depends_on:
      <<: *stack
      core-python-migrate:
        condition: service_completed_successfully
    environment:
      <<: [*service-env, *core-python-db]
      WFK_WORKER_MODEL: ${WFK_WORKER_MODEL:-local-mock}
      WFK_EXTRACTOR: ${WFK_BRAIN_EXTRACTOR:-baseline}
      WFK_EXTRACTION_MODEL: ${WFK_BRAIN_EXTRACTION_MODEL:-claude-haiku}
    ports:
      - "127.0.0.1:${WFK_CORE_PYTHON_PORT:-7001}:7001"
    healthcheck:
      <<: *grpc-health
      test: ["CMD", "python", "-c", *grpc-probe, "7001"]

  core-rust-migrate:
    <<: *migrate
    image: wfk/core-rust:local
    build: ../microservices/core-rust
    command: ["migrate"]
    environment: &core-rust-db
      WFK_TASK_DATABASE_URL: postgresql://wfk:wfk@postgres:5432/task_db
      WFK_CHANNEL_DATABASE_URL: postgresql://wfk:wfk@postgres:5432/channel_db
      WFK_SANDBOX_DATABASE_URL: postgresql://wfk:wfk@postgres:5432/sandbox_db

  # The Rust backend in one binary: TaskService, ChannelService and SandboxService, and the
  # channel webhooks, on 7002. Providers post to http://<host>:7002/hooks/{kind}/{binding_id}.
  # The sandbox runs untrusted code in hardened containers through the Docker socket: locally
  # only. That is why this container runs as root here; production uses gVisor pods instead
  # (no socket, no root). Set WFK_SANDBOX_RUNTIME=runsc where gVisor is installed.
  core-rust:
    <<: *service
    image: wfk/core-rust:local
    user: "0:0"
    depends_on:
      <<: *stack
      core-rust-migrate:
        condition: service_completed_successfully
    environment:
      <<: [*service-env, *core-rust-db]
      WFK_SANDBOX_RUNTIME: ${WFK_SANDBOX_RUNTIME:-}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - "127.0.0.1:${WFK_CORE_RUST_PORT:-7002}:7002"
    healthcheck:
      <<: *grpc-health
      test: ["CMD", "/service", "healthcheck"]

  # The web app and public REST API: http://127.0.0.1:7000
  web-app:
    <<: *service
    image: wfk/web-app:local
    build: ../microservices/web-app
    depends_on:
      core-python:
        condition: service_healthy
      core-rust:
        condition: service_healthy
    environment:
      WFK_TASK_SERVICE_ADDR: core-rust:7002
      WFK_RUN_SERVICE_ADDR: core-python:7001
      WFK_BRAIN_SERVICE_ADDR: core-python:7001
      WFK_WORKFORCE_SERVICE_ADDR: core-python:7001
      WFK_NATS_URL: nats://nats:4222
      WFK_AUTH_MODE: dev
      WFK_API_TOKEN: ${WFK_API_TOKEN:-}
    ports:
      - "127.0.0.1:${WFK_WEB_PORT:-7000}:7000"
    healthcheck:
      <<: *grpc-health
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:7000/healthz >/dev/null"]

volumes:
  pg-data:
  nats-data:
  seaweed-data:
  lgtm-data:
