name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  UV_LOCKED: "1" # fail if uv.lock is out of date

jobs:
  python:
    name: Python lint, types, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --all-packages
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pyright
      - run: uv run pytest -m "not integration"
      - name: Generated Python contracts are up to date
        run: |
          uv run --package wfk-contracts --group dev python libs/python/wfk-contracts/tools/gen_python.py
          git diff --exit-code -- libs/python/wfk-contracts/src
      - name: Python licences (ADR-0007)
        run: uv run python tools/check_licenses.py

  rust:
    name: Rust fmt, clippy, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # rust-toolchain.toml pins the version; rustup on the runner installs it on first use.
      - run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked

  licences-rust:
    name: Rust licences and advisories (ADR-0007)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - run: cargo deny --locked check licenses bans sources advisories

  contracts:
    name: Protobuf lint and breaking changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npx -y @bufbuild/buf@1.47.2 lint
        working-directory: contracts
      - name: buf breaking (against the base branch)
        if: github.event_name == 'pull_request'
        working-directory: contracts
        run: |
          if git cat-file -e "origin/${{ github.base_ref }}:contracts/buf.yaml" 2>/dev/null; then
            npx -y @bufbuild/buf@1.47.2 breaking --against "../.git#branch=origin/${{ github.base_ref }},subdir=contracts"
          else
            echo "No contracts on the base branch yet; nothing to compare."
          fi

  integration:
    name: Integration tests (docker compose stack)
    runs-on: ubuntu-latest
    needs: [python, rust]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: Swatinem/rust-cache@v2
      - name: Start Postgres and NATS
        run: docker compose -f deployments/docker-compose.yml up -d --wait postgres nats
      - run: uv sync --all-packages
      - run: uv run pytest -m integration
      - run: cargo test --workspace --locked -- --ignored
      - name: Stack logs on failure
        if: failure()
        run: docker compose -f deployments/docker-compose.yml logs --no-color

  images:
    name: Service template images build
    runs-on: ubuntu-latest
    needs: [python, rust]
    strategy:
      matrix:
        lang: [python, rust]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: templates/${{ matrix.lang }}-service/Dockerfile
          push: false
          cache-from: type=gha,scope=${{ matrix.lang }}
          cache-to: type=gha,mode=max,scope=${{ matrix.lang }}
