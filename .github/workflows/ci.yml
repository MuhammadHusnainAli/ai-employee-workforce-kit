name: CI

# Every microservice is its own project. This workflow finds them and checks each one from
# inside its own folder, exactly as `just ci` does locally:
#   Python services: microservices/**/pyproject.toml
#   Rust services:   microservices/**/Cargo.toml
# The templates in microservices/templates are real services and are checked the same way.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  BUF: npx -y @bufbuild/buf@1.47.2

jobs:
  discover:
    name: Find services
    runs-on: ubuntu-latest
    outputs:
      python: ${{ steps.find.outputs.python }}
      rust: ${{ steps.find.outputs.rust }}
    steps:
      - uses: actions/checkout@v4
      - id: find
        run: |
          list() { find microservices -name "$1" -not -path '*/target/*' -not -path '*/.venv/*' \
                     -exec dirname {} \; | sort | jq -R . | jq -cs .; }
          echo "python=$(list pyproject.toml)" >> "$GITHUB_OUTPUT"
          echo "rust=$(list Cargo.toml)" >> "$GITHUB_OUTPUT"
          echo "python: $(list pyproject.toml)"
          echo "rust:   $(list Cargo.toml)"

  generator:
    name: Service generator
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uvx pytest tests -q
        working-directory: microservices/templates

  python:
    name: Python ${{ matrix.service }}
    needs: discover
    if: needs.discover.outputs.python != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.discover.outputs.python) }}
    defaults:
      run:
        working-directory: ${{ matrix.service }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: ${{ matrix.service }}/uv.lock
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pyright
      - run: uv run pytest -m "not integration"
      - name: Generated contract code is up to date
        run: |
          uv run python tools/gen_contracts.py
          git diff --exit-code -- src/wfk
      - name: Protobuf lint
        run: $BUF lint
        working-directory: ${{ matrix.service }}/contracts
      - name: Licences (ADR-0007)
        run: uv run python tools/check_licenses.py
      - name: Start the local stack
        run: |
          docker compose -f deployments/docker-compose.yml up -d --wait
          docker compose -f deployments/docker-compose.yml --profile init run --rm seaweedfs-init
        working-directory: .
      - run: uv run pytest -m integration
      - name: Image builds
        run: docker build -t ci-image .
      - name: Stack logs on failure
        if: failure()
        run: docker compose -f deployments/docker-compose.yml logs --no-color
        working-directory: .

  rust:
    name: Rust ${{ matrix.service }}
    needs: discover
    if: needs.discover.outputs.rust != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.discover.outputs.rust) }}
    defaults:
      run:
        working-directory: ${{ matrix.service }}
    steps:
      - uses: actions/checkout@v4
      # The service's rust-toolchain.toml pins the version; rustup installs it on first use.
      - run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ${{ matrix.service }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --all-features --locked -- -D warnings
      - run: cargo test --locked
      - name: Protobuf lint
        if: hashFiles(format('{0}/contracts/buf.yaml', matrix.service)) != ''
        run: $BUF lint
        working-directory: ${{ matrix.service }}/contracts
      - name: Licences and advisories (ADR-0007)
        run: cargo deny --locked check licenses bans sources advisories
      - name: Start the local stack
        run: |
          docker compose -f deployments/docker-compose.yml up -d --wait
          docker compose -f deployments/docker-compose.yml --profile init run --rm seaweedfs-init
        working-directory: .
      - run: cargo test --locked -- --ignored
      - name: Image builds
        # A Rust crate inside a Python service (brain-core) has no image of its own.
        if: hashFiles(format('{0}/Dockerfile', matrix.service)) != ''
        run: docker build -t ci-image .
      - name: Stack logs on failure
        if: failure()
        run: docker compose -f deployments/docker-compose.yml logs --no-color
        working-directory: .
